name: Build & Test

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build-and-test:
    # The app targets net10.0-windows (WinExe, DPAPI), so tests must run on Windows too.
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore ModelTimer.slnx

      - name: Build
        run: dotnet build ModelTimer.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test ModelTimer.slnx --no-build --configuration Release --logger "console;verbosity=normal"
